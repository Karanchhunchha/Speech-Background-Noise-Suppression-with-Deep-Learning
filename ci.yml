# GitHub Actions CI for this repository (MATLAB test suite).
#
# SETUP (repository owner, one minute): the automation that maintains
# this repository cannot create files under .github/workflows/ (the
# GitHub App permission set excludes it), so this file is kept at the
# repository root as a ready-to-install copy. Move it to
#   .github/workflows/ci.yml
# via the GitHub web UI (Add file -> Create new file, paste this
# content) and Actions will run the test suite on every push and pull
# request. Until then the README keeps its static test badge — it does
# not claim a live CI status that does not exist.
name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          products: Deep Learning Toolbox
      - uses: matlab-actions/run-tests@v2
        with:
          test-results-junit: test-results/results.xml
          source-folder: .
          startup-options: -nojvm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results
